name: CodeScan CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-and-scan:
    name: Test and scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python files
        run: python -m compileall -q src scripts tests/test_*.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run CodeScan on CI target
        id: codescan
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: >
          python -m quality_scanner scan
          --project tests/fixtures/ci_target_project
          --config rules/default_rules.json
          --output reports/ci_target_full
          --sonar-base-dir .
          --mode FULL

      - name: Upload CodeScan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codescan-reports
          path: reports/ci_target_full/

      - name: Run SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: >
            -Dsonar.externalIssuesReportPaths=reports/ci_target_full/sonar-external-issues.json
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Enforce CodeScan quality gate
        if: ${{ always() && steps.codescan.outcome == 'failure' }}
        run: exit 1
